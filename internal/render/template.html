<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - mermd</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --fg-muted: #656d76;
      --border: #d0d7de;
      --border-muted: #d8dee4;
      --code-bg: #f6f8fa;
      --blockquote-fg: #57606a;
      --link: #0969da;
      --table-alt: #f6f8fa;
      --toolbar-bg: rgba(255, 255, 255, 0.9);
      --err-bg: #ffebe9;
      --err-border: #ff8182;
      --err-fg: #cf222e;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --border: #30363d;
      --border-muted: #21262d;
      --code-bg: #161b22;
      --blockquote-fg: #8b949e;
      --link: #58a6ff;
      --table-alt: #161b22;
      --toolbar-bg: rgba(22, 27, 34, 0.9);
      --err-bg: rgba(248, 81, 73, 0.15);
      --err-border: #f85149;
      --err-fg: #ff7b72;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      transition: background-color 0.2s, color 0.2s;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 24px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-muted);
      font-size: 13px;
      color: var(--fg-muted);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .brand {
      color: var(--link);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2da44e;
      display: inline-block;
    }

    .status-dot.disconnected {
      background: var(--fg-muted);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--code-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover {
      border-color: var(--link);
    }

    .markdown-body {
      max-width: 920px;
      margin: 32px auto 80px;
      padding: 0 24px;
      word-wrap: break-word;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .markdown-body h1 {
      font-size: 2em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-muted);
    }

    .markdown-body h2 {
      font-size: 1.5em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-muted);
    }

    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body a {
      color: var(--link);
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body blockquote {
      padding: 0 1em;
      color: var(--blockquote-fg);
      border-left: 0.25em solid var(--border);
      margin-left: 0;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 2em;
    }

    .markdown-body code {
      padding: 0.2em 0.4em;
      font-size: 85%;
      background-color: var(--code-bg);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .markdown-body pre {
      padding: 16px;
      overflow: auto;
      font-size: 85%;
      line-height: 1.45;
      background-color: var(--code-bg);
      border-radius: 6px;
      border: 1px solid var(--border-muted);
    }

    .markdown-body pre code {
      padding: 0;
      background-color: transparent;
      border-radius: 0;
      font-size: 100%;
    }

    .markdown-body table {
      border-spacing: 0;
      border-collapse: collapse;
      width: 100%;
      overflow: auto;
      display: block;
    }

    .markdown-body table th,
    .markdown-body table td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    .markdown-body table th {
      font-weight: 600;
    }

    .markdown-body table tr:nth-child(2n) {
      background-color: var(--table-alt);
    }

    .markdown-body hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background-color: var(--border-muted);
      border: 0;
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
    }

    .mermaid-wrapper {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--border-muted);
      border-radius: 8px;
      background: var(--bg);
      overflow-x: auto;
      text-align: center;
    }

    .mermaid-wrapper svg {
      max-width: 100%;
      height: auto;
    }

    .mermaid-error {
      text-align: left;
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: var(--err-fg);
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .mermaid-error pre {
      margin-top: 8px;
      margin-bottom: 0;
      color: var(--fg);
    }
  </style>
</head>
<body>
  {{if .LiveReload}}
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="brand">mermd</span>
      <span>/</span>
      <span>{{.Title}}</span>
      <span id="status-dot" class="status-dot" title="Live reload active"></span>
    </div>
    <div class="toolbar-right">
      <button id="theme-toggle" class="btn" type="button">Theme</button>
    </div>
  </header>
  {{end}}

  <main id="content" class="markdown-body">
    {{.Content}}
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = localStorage.getItem('mermd-theme') || (prefersDark ? 'dark' : 'light');

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mermd-theme', theme);
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
      }
    }

    let renderSeq = 0;

    async function renderMermaidDiagrams() {
      mermaid.initialize({
        startOnLoad: false,
        theme: currentTheme === 'dark' ? 'dark' : 'default',
        securityLevel: 'loose',
      });

      const wrappers = document.querySelectorAll('.mermaid-wrapper');
      for (const wrapper of wrappers) {
        const pre = wrapper.querySelector('pre.mermaid');
        let source = wrapper.getAttribute('data-source');
        if (!source && pre) {
          source = pre.textContent;
          wrapper.setAttribute('data-source', source);
        }
        if (!source) continue;

        renderSeq += 1;
        const id = `mermaid-svg-${renderSeq}`;
        try {
          const { svg } = await mermaid.render(id, source);
          wrapper.innerHTML = svg;
        } catch (err) {
          const msg = err && err.message ? err.message : String(err);
          const escapedMsg = msg.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const escapedSrc = source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          wrapper.innerHTML = `
            <div class="mermaid-error">
              <strong>Mermaid syntax error:</strong> ${escapedMsg}
              <pre><code>${escapedSrc}</code></pre>
            </div>`;
        }
      }
    }

    applyTheme(currentTheme);
    await renderMermaidDiagrams();

    const toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', async () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        await renderMermaidDiagrams();
      });
    }

    {{if .LiveReload}}
    const dot = document.getElementById('status-dot');
    const evtSource = new EventSource('/events');
    evtSource.addEventListener('reload', async () => {
      try {
        const res = await fetch('/api/content');
        if (!res.ok) return;
        const html = await res.text();
        document.getElementById('content').innerHTML = html;
        await renderMermaidDiagrams();
      } catch (e) {
        console.error('Reload failed:', e);
      }
    });
    evtSource.onopen = () => {
      if (dot) dot.classList.remove('disconnected');
    };
    evtSource.onerror = () => {
      if (dot) dot.classList.add('disconnected');
    };
    {{end}}
  </script>
</body>
</html>
